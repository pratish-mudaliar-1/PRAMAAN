[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pramaan-backend"
version = "0.1.0"
description = "PRAMAAN: Smart India Hackathon PS-26245 backend — edge-device observation ingestion and reconciliation platform"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Pydantic / settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # DB
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Redis / task queue
    "redis>=5.1.0",
    "arq>=0.26.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "PyNaCl>=1.5.0",
    "httpx>=0.27.0",
    # Observability
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp>=1.27.0",
    # S3 / MinIO
    "aioboto3>=13.0.0",
    # Rate limiting
    "slowapi>=0.1.9",
    # Images (evidence perceptual hash)
    "Pillow>=10.4.0",
    "imagehash>=4.3.1",
    # YAML
    "pyyaml>=6.0.2",
    # Misc utilities
    "orjson>=3.10.0",
    "tenacity>=9.0.0",
    "ulid-py>=1.1.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "testcontainers[postgres,redis]>=4.8.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.6.9",
    "mypy>=1.11.0",
    "types-PyYAML>=6.0.12",
    "types-python-dateutil>=2.9.0",
    "moto[s3]>=5.0.0",
    "httpx2>=0.28.0",
    "faker>=30.0.0",
    "locust>=2.31.0",
    "anyio>=4.6.0",
    "pip-audit>=2.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── Ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "S", "B", "A", "C4", "T20", "RET", "SIM", "TCH", "ANN"]
ignore = [
    "ANN101",  # self annotation
    "ANN102",  # cls annotation
    "S101",    # assert in tests is fine
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN", "T20"]
"alembic/*" = ["ANN"]

# ── mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["alembic.*", "tests.*", "scripts.*"]
ignore_errors = true

# ── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=0"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore::ResourceWarning",
]

[tool.coverage.run]
branch = true
omit = ["alembic/*", "tests/*", "scripts/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
